schema_version = "linuxmice.component.v1"
id = "katteke.plugroot"
display_name = "Plugroot"
version = "0.1.0"
summary = "Optional LinuxMice provider integration that remains independently deployable."
component_type = "provider"
standalone = true
platforms = ["debian", "ubuntu"]
documentation = "https://docs.katteke.com/products/plugroot/"

[installation]
package = "linuxmice-provider-plugroot"

[capabilities]
provides = ["provider.plugroot"]
requires = []
optional = []

[interfaces]
mode = "loopback-http"
commands = []
endpoints = ["http://127.0.0.1:8786/.well-known/linuxmice/component"]

[authentication]
required = []
optional = []
provides = []

[data]
ownership = "Plugroot-owned provider state; LinuxMice reads only the declared status surface."
backup_responsibility = "The Plugroot operator owns provider backup and restore."

[health]
kind = "http"
read_only = true
timeout_ms = 1500

[health.http]
url = "http://127.0.0.1:8786/.well-known/linuxmice/component"
expected_status = 200
