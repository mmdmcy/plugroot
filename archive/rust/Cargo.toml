# Archived 2026-11-08: the Go version at the repository root replaced this
# Rust Plugroot with the same commands, output, files and HTTP behaviour.
# Kept so the old version can be built, tested and compared:
#   cargo test --manifest-path archive/rust/Cargo.toml
#   cargo build --release --manifest-path archive/rust/Cargo.toml
[package]
name = "plugroot"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private-first selfhost harness for Compose stacks, Git checkouts, systemd units, and status surfaces."

[dependencies]
base64 = "0.22"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
