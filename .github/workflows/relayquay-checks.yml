name: RelayQuay checks

on:
  pull_request:
    paths:
      - relayquay/**
      - .github/workflows/relayquay-checks.yml
  push:
    branches:
      - main
    paths:
      - relayquay/**
      - .github/workflows/relayquay-checks.yml

jobs:
  shell-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check helper syntax
        working-directory: relayquay
        run: bash -n bin/relayquay

      - name: Render default compose config
        working-directory: relayquay
        run: |
          cp .env.example /tmp/relayquay.env
          RELAYQUAY_ENV_FILE=/tmp/relayquay.env ./bin/relayquay config >/tmp/relayquay-compose.yaml

      - uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        working-directory: relayquay
        run: terraform fmt -check -recursive infra/cloudflare/terraform

      - name: Validate Terraform reference
        working-directory: relayquay/infra/cloudflare/terraform
        run: |
          terraform init -backend=false
          terraform validate
