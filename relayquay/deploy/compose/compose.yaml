name: relayquay

services:
  caddy:
    image: caddy:${CADDY_TAG:-2-alpine}
    restart: ${RELAYQUAY_RESTART_POLICY:-unless-stopped}
    network_mode: host
    environment:
      RELAYQUAY_BIND: ${RELAYQUAY_BIND:-127.0.0.1}
      RELAYQUAY_LISTEN_PORT: ${RELAYQUAY_LISTEN_PORT:-8788}
      ROV_UPSTREAM: ${ROV_UPSTREAM:-127.0.0.1:45080}
    volumes:
      - ${RELAYQUAY_CADDYFILE:-./deploy/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${RELAYQUAY_STATE_DIR:-./state}/caddy:/data

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2026.6.1}
    restart: ${RELAYQUAY_RESTART_POLICY:-unless-stopped}
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in the private env file}
    command: tunnel --no-autoupdate --protocol ${CLOUDFLARED_PROTOCOL:-quic} run
    depends_on:
      - caddy
